<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A creative, responsive developer portfolio built with React and Tailwind CSS."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>DevLaunch — Developer Portfolio</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("devlaunch-theme");
        const validThemes = ["minimal-pro", "creative-studio", "dark-pro"];
        document.documentElement.dataset.theme = validThemes.includes(savedTheme)
          ? savedTheme
          : "minimal-pro";
      } catch {
        document.documentElement.dataset.theme = "minimal-pro";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
